name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded run tells us nothing; cancel it rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The team develops on Windows; Linux is the cheap runner. Both are run
        # because the holdout guard resolves and compares filesystem paths, and
        # path behaviour is exactly the kind of thing that works on one and not
        # the other.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Confirm the holdout is locked
        # The unlock is a deliberate, local, one-off act (decision 0002). If it
        # is ever set repository-wide as a variable or secret, the holdout stops
        # being held out and nothing else would notice.
        shell: bash
        run: |
          if [ "${ESCALENT_ALLOW_HOLDOUT:-}" = "1" ]; then
            echo "ESCALENT_ALLOW_HOLDOUT is set in CI. The holdout must stay locked."
            exit 1
          fi
          echo "Holdout is locked."

      - name: Run tests
        run: python -m pytest
